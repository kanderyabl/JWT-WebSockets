<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JWT Chat</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #0f0f0f; color: #e0e0e0; }
    .container { max-width: 900px; margin: 0 auto; padding: 24px; }
    .card { background: #1a1a1a; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.5); border: 1px solid #333; }
    input, button, textarea { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #444; border-radius: 8px; font-size: 16px; background: #2a2a2a; color: #e0e0e0; }
    input::placeholder, textarea::placeholder { color: #888; }
    button { cursor: pointer; background: #3b82f6; color: white; border: none; transition: all 0.2s; }
    button:hover { opacity: .85; background: #2563eb; }
    #chat { display: grid; grid-template-columns: 1fr 280px; gap: 16px; }
    #messages { min-height: 320px; overflow-y: auto; border: 1px solid #333; padding: 12px; border-radius: 10px; background: #0f0f0f; }
    .message { margin-bottom: 12px; }
    .meta { color: #888; font-size: .9rem; margin-bottom: 4px; }
    .system { color: #666; font-style: italic; }
    #user-list { border: 1px solid #333; border-radius: 10px; padding: 12px; background: #0f0f0f; }
    .hidden { display: none; }
    h1, h3 { color: #fff; }
    label { display: block; color: #b0b0b0; margin-bottom: 6px; }
    p { color: #a0a0a0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>JWT чат</h1>
      <p>Зарегистрируйся, войди и общайся в реальном времени через WebSocket.</p>

      <div id="auth-panel">
        <div>
          <label>Имя</label>
          <input id="username" placeholder="Введите имя" />
        </div>
        <div>
          <label>Пароль</label>
          <input id="password" type="password" placeholder="Введите пароль" />
        </div>
        <div>
          <button id="btn-register">Зарегистрироваться</button>
          <button id="btn-login">Войти</button>
        </div>
        <p id="auth-error" style="color:#b91c1c"></p>
      </div>

      <div id="chat-panel" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <div>
            <strong>Вошел как <span id="current-user"></span></strong>
          </div>
          <button id="btn-logout" style="width:auto; background:#ef4444">Выйти</button>
        </div>
        <div id="chat">
          <div>
            <div id="messages"></div>
            <form id="chat-form">
              <textarea id="message-input" rows="3" placeholder="Напиши сообщение..."></textarea>
              <button type="submit">Отправить</button>
            </form>
          </div>
          <div id="user-list">
            <h3>Пользователи</h3>
            <ul id="users"></ul>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
